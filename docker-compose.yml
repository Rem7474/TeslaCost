services:
  postgres:
    image: postgres:16-alpine
    container_name: teslacost-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-teslacost}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-teslacost_dev_secret}
      POSTGRES_DB: ${DB_NAME:-teslacost}
    ports:
      # Bound to localhost only: the DB does not need to be reachable from outside the host.
      # Set DB_PORT_BIND to 0.0.0.0:5432 (or similar) if you need external access.
      - "${DB_PORT_BIND:-127.0.0.1:5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-teslacost} -d ${DB_NAME:-teslacost}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    # Pin TESLACOST_VERSION (e.g. "v1.17.0") in your .env for reproducible deployments.
    # Defaults to "latest" for the quick-start curl-and-go flow described in the README.
    image: ghcr.io/rem7474/teslacost:${TESLACOST_VERSION:-latest}
    pull_policy: missing
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: teslacost-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      PORT: 8080
      # This compose file is the production deployment path; docker-compose.dev.yml overrides
      # this back to "development" for the local hot-reload workflow.
      ENVIRONMENT: ${ENVIRONMENT:-production}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-teslacost}
      DB_PASSWORD: ${DB_PASSWORD:-teslacost_dev_secret}
      DB_NAME: ${DB_NAME:-teslacost}
      DB_SSLMODE: disable
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-change-this-to-a-secure-32-byte-key-in-prod!}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_signing_key_for_teslacost_app}
      JWT_ACCESS_EXPIRATION_MINUTES: ${JWT_ACCESS_EXPIRATION_MINUTES:-}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-}
      # Reverse proxy and browser hardening (see the README, section "Exposition sur Internet")
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      SECURITY_HEADERS: ${SECURITY_HEADERS:-}
      CONTENT_SECURITY_POLICY: ${CONTENT_SECURITY_POLICY:-}
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-false}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Paris}
      STORAGE_DIR: ${STORAGE_DIR:-/data/documents}
      # --- OIDC / SSO (optional) ---
      # Leave OIDC_ISSUER_URL empty to use local email/password auth only.
      # Uncomment and fill in to enable SSO via Authentik, Keycloak, Authelia, etc.
      # OIDC_ISSUER_URL: https://auth.homelab.local/application/o/teslacost/
      # OIDC_CLIENT_ID: teslacost
      # OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      # OIDC_REDIRECT_URL: https://teslacost.homelab.local/api/auth/oidc/callback
      # OIDC_PROVIDER_NAME: Authentik
      # OIDC_ALLOWED_EMAILS: ${OIDC_ALLOWED_EMAILS:-}
      # OIDC_DISABLE_LOCAL_AUTH: "false"
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - teslacost_documents:/data/documents
    extra_hosts:
      - "host.docker.internal:host-gateway"

  backup:
    # Published alongside the api image with the same tag, so this file works on its own
    # (no repo checkout needed). The build section is only used for local development.
    image: ghcr.io/rem7474/teslacost-backup:${TESLACOST_VERSION:-latest}
    pull_policy: missing
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: teslacost-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        # Wait for the app's own healthcheck (which requires a live DB connection) rather than
        # just postgres, so the first backup cycle doesn't race the schema migrations on startup.
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-teslacost}
      DB_PASSWORD: ${DB_PASSWORD:-teslacost_dev_secret}
      DB_NAME: ${DB_NAME:-teslacost}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - teslacost_documents:/data/documents:ro
      - teslacost_backups:/backups
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  teslacost_documents:
    driver: local
  teslacost_backups:
    driver: local
