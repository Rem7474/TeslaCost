services:
  postgres:
    image: postgres:16-alpine
    container_name: teslacost-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-teslacost}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-teslacost_dev_secret}
      POSTGRES_DB: ${DB_NAME:-teslacost}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-teslacost} -d ${DB_NAME:-teslacost}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/rem7474/teslacost:latest
    # Pour compiler les sources locales au lieu d'utiliser l'image pré-compilée :
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   target: prod
    container_name: teslacost-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-teslacost}
      DB_PASSWORD: ${DB_PASSWORD:-teslacost_dev_secret}
      DB_NAME: ${DB_NAME:-teslacost}
      DB_SSLMODE: disable
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-change-this-to-a-secure-32-byte-key-in-prod!}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_signing_key_for_teslacost_app}
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-false}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8080}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Paris}
      # --- OIDC / SSO (optional) ---
      # Leave OIDC_ISSUER_URL empty to use local email/password auth only.
      # Uncomment and fill in to enable SSO via Authentik, Keycloak, Authelia, etc.
      # OIDC_ISSUER_URL: https://auth.homelab.local/application/o/teslacost/
      # OIDC_CLIENT_ID: teslacost
      # OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      # OIDC_REDIRECT_URL: https://teslacost.homelab.local/api/auth/oidc/callback
      # OIDC_PROVIDER_NAME: Authentik
      # OIDC_ALLOWED_EMAILS: ${OIDC_ALLOWED_EMAILS:-}
      # OIDC_DISABLE_LOCAL_AUTH: "false"
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - teslacost_documents:/data/documents
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
    driver: local
  teslacost_documents:
    driver: local
