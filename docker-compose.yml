services:
  postgres:
    image: postgres:16-alpine
    container_name: teslacost-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-teslacost}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-teslacost_dev_secret}
      POSTGRES_DB: ${DB_NAME:-teslacost}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-teslacost} -d ${DB_NAME:-teslacost}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/rem7474/teslacost:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: teslacost-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      DATABASE_URL: postgres://${DB_USER:-teslacost}:${DB_PASSWORD:-teslacost_dev_secret}@postgres:5432/${DB_NAME:-teslacost}?sslmode=disable
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-change-this-to-a-secure-32-byte-key-in-prod!}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_signing_key_for_teslacost_app}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8080}
    ports:
      - "${PORT:-8080}:8080"

volumes:
  postgres_data:
    driver: local
